<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Button</title>
<style>
  html { background: var(--wk-color-bg); }
  .spec { display: grid; grid-template-columns: 120px 1fr; gap: var(--wk-space-3) var(--wk-space-4); align-items: center; padding: var(--wk-space-4); }
  .spec > dt { color: var(--wk-color-text-secondary); font-size: var(--wk-font-size-sm); }
  .spec > dd { display: flex; flex-wrap: wrap; align-items: center; gap: var(--wk-space-2); margin: 0; }
</style>
</head>
<body class="wk-root">
<dl class="spec">
  <dt>Default · primary</dt>
  <dd><button class="wk-button" type="button">Take a break</button><button class="wk-button wk-button--primary" type="button">Join another HQ</button><button class="wk-button wk-button--primary" type="button">Done</button></dd>
  <dt>Destructive · quiet</dt>
  <dd><button class="wk-button wk-button--destructive" type="button">Leave HQ…</button><button class="wk-button wk-button--destructive" type="button">Stop job</button><button class="wk-button wk-button--quiet" type="button">Cancel</button></dd>
  <dt>Small · icon</dt>
  <dd><button class="wk-button wk-button--small" type="button">Refresh</button><button class="wk-button wk-button--small" type="button">Use default</button><button class="wk-button wk-button--quiet wk-button--icon" type="button" aria-label="Settings"><svg viewBox="0 0 22 22" aria-hidden="true"><g fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><circle cx="11" cy="11" r="3"/><path d="M11 2.5v2.5M11 17v2.5M2.5 11H5M17 11h2.5M5 5l1.8 1.8M15.2 15.2 17 17M5 17l1.8-1.8M15.2 6.8 17 5"/></g></svg></button><button class="wk-button wk-button--quiet wk-button--icon" type="button" aria-label="Show or hide sidebar"><svg viewBox="0 0 18 15" aria-hidden="true"><rect x=".75" y=".75" width="16.5" height="13.5" rx="2.5" fill="none" stroke="currentColor" stroke-width="1.4"/><path d="M6 1v13" stroke="currentColor" stroke-width="1.4"/></svg></button></dd>
  <dt>Locked · disabled</dt>
  <dd><button class="wk-button" type="button" aria-disabled="true" data-locked title="Needs manage access"><svg viewBox="0 0 12 12" aria-hidden="true"><g fill="none" stroke="currentColor" stroke-width="1.3"><rect x="2" y="5.2" width="8" height="5.6" rx="1"/><path d="M3.8 5.2V3.8a2.2 2.2 0 0 1 4.4 0v1.4"/></g></svg>Invite a machine</button><button class="wk-button wk-button--small" type="button" aria-disabled="true" data-locked title="Needs manage access"><svg viewBox="0 0 12 12" aria-hidden="true"><g fill="none" stroke="currentColor" stroke-width="1.3"><rect x="2" y="5.2" width="8" height="5.6" rx="1"/><path d="M3.8 5.2V3.8a2.2 2.2 0 0 1 4.4 0v1.4"/></g></svg>Stop…</button><button class="wk-button wk-button--primary" type="button" disabled>Continue</button></dd>
</dl>
</body>
</html>
