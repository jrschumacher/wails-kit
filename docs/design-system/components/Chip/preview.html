<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Chip</title>
<style>
  html { background: var(--wk-color-bg); }
  .spec { display: grid; grid-template-columns: 120px 1fr; gap: var(--wk-space-3) var(--wk-space-4); align-items: center; padding: var(--wk-space-4); }
  .spec > dt { color: var(--wk-color-text-secondary); font-size: var(--wk-font-size-sm); }
  .spec > dd { display: flex; flex-wrap: wrap; align-items: center; gap: var(--wk-space-2); margin: 0; }
</style>
</head>
<body class="wk-root">
<dl class="spec">
  <dt>Default</dt>
  <dd><span class="wk-chip" title="runs-on: self-hosted">Any Linux</span><span class="wk-chip" title="runs-on: [linux, ARM64]">Linux ARM64</span><span class="wk-chip">update available</span><span class="wk-chip">Lender</span></dd>
  <dt>Count · attention</dt>
  <dd><span class="wk-chip wk-chip--count" title="Active machines">2</span><span class="wk-chip wk-chip--count">6</span><span class="wk-chip wk-chip--attention" aria-label="1 needs attention">1</span></dd>
  <dt>Dot · muted</dt>
  <dd><span class="wk-chip"><span class="wk-dot" data-size="sm" data-tone="working" aria-hidden="true"></span>claude-opus · running</span><span class="wk-chip"><span class="wk-dot" data-size="sm" aria-hidden="true"></span>codex-high · 3 findings</span><span class="wk-chip wk-chip--muted">No reviewer runs yet</span></dd>
  <dt>Access</dt>
  <dd><span class="wk-chip wk-chip--access"><svg viewBox="0 0 12 12" aria-hidden="true"><g fill="none" stroke="currentColor" stroke-width="1.2"><path d="M1 6s1.8-3.5 5-3.5S11 6 11 6s-1.8 3.5-5 3.5S1 6 1 6z"/><circle cx="6" cy="6" r="1.5"/></g></svg>View only</span><span class="wk-chip wk-chip--access" data-level="manage"><svg viewBox="0 0 12 12" aria-hidden="true"><g fill="none" stroke="currentColor" stroke-width="1.3"><rect x="2" y="5.2" width="8" height="5.6" rx="1"/><path d="M3.8 5.2V3.8a2.2 2.2 0 0 1 4.4 0v1.4"/></g></svg>Can manage</span></dd>
</dl>
</body>
</html>
