<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>SearchField</title>
<style>
  html { background: var(--wk-color-bg); }
  .spec { display: grid; grid-template-columns: 120px 1fr; gap: var(--wk-space-3) var(--wk-space-4); align-items: center; padding: var(--wk-space-4); }
  .spec > dt { color: var(--wk-color-text-secondary); font-size: var(--wk-font-size-sm); }
  .spec > dd { display: flex; align-items: center; gap: var(--wk-space-3); margin: 0; }
</style>
</head>
<body class="wk-root">
<dl class="spec">
  <dt>Empty</dt>
  <dd><span class="wk-search" style="width:180px"><input class="wk-field" type="search" placeholder="Filter jobs" aria-label="Filter jobs"></span></dd>
  <dt>With a query</dt>
  <dd><span class="wk-search" style="width:180px"><input class="wk-field" type="search" value="platform" aria-label="Filter jobs"></span><span class="wk-caption" role="status">3 of 44 match</span></dd>
</dl>
</body>
</html>
