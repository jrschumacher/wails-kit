<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Toolbar</title>
<style>
  html { background: var(--wk-color-bg); }
  .spec { display: flex; flex-direction: column; gap: var(--wk-space-3); padding: var(--wk-space-4); }
  .spec > .wk-toolbar { border: var(--wk-hairline-width) solid var(--wk-color-hairline); border-radius: var(--wk-radius-control); }
</style>
</head>
<body class="wk-root">
<div class="spec">
  <div class="wk-toolbar" role="toolbar" aria-label="Now">
    <button class="wk-button wk-button--quiet wk-button--icon" type="button" aria-label="Show or hide sidebar" title="Show or hide sidebar (⌃⌘S)"><svg viewBox="0 0 18 15" aria-hidden="true"><rect x=".75" y=".75" width="16.5" height="13.5" rx="2.5" fill="none" stroke="currentColor" stroke-width="1.4"/><path d="M6 1v13" stroke="currentColor" stroke-width="1.4"/></svg></button>
    <h1 class="wk-toolbar-title">Now</h1>
    <span class="wk-toolbar-spacer"></span>
    <span class="wk-dot-label"><span class="wk-dot" data-size="sm" aria-hidden="true"></span><span>Connected</span></span>
    <span class="wk-chip wk-chip--access"><svg viewBox="0 0 12 12" aria-hidden="true"><g fill="none" stroke="currentColor" stroke-width="1.2"><path d="M1 6s1.8-3.5 5-3.5S11 6 11 6s-1.8 3.5-5 3.5S1 6 1 6z"/><circle cx="6" cy="6" r="1.5"/></g></svg>View only</span>
    <button class="wk-button" type="button" aria-disabled="true" data-locked title="Needs manage access"><svg viewBox="0 0 12 12" aria-hidden="true"><g fill="none" stroke="currentColor" stroke-width="1.3"><rect x="2" y="5.2" width="8" height="5.6" rx="1"/><path d="M3.8 5.2V3.8a2.2 2.2 0 0 1 4.4 0v1.4"/></g></svg>Invite a machine</button>
  </div>
  <div class="wk-toolbar" role="toolbar" aria-label="Machines">
    <button class="wk-button wk-button--quiet wk-button--icon" type="button" aria-label="Show or hide sidebar"><svg viewBox="0 0 18 15" aria-hidden="true"><rect x=".75" y=".75" width="16.5" height="13.5" rx="2.5" fill="none" stroke="currentColor" stroke-width="1.4"/><path d="M6 1v13" stroke="currentColor" stroke-width="1.4"/></svg></button>
    <h1 class="wk-toolbar-title">Machines<span class="wk-toolbar-subtitle">last 14 days</span></h1>
    <span class="wk-toolbar-spacer"></span>
    <span class="wk-search"><input class="wk-field" type="search" placeholder="Filter" aria-label="Filter machines"></span>
    <span class="wk-chip wk-chip--access" data-level="manage"><svg viewBox="0 0 12 12" aria-hidden="true"><g fill="none" stroke="currentColor" stroke-width="1.3"><rect x="2" y="5.2" width="8" height="5.6" rx="1"/><path d="M3.8 5.2V3.8a2.2 2.2 0 0 1 4.4 0v1.4"/></g></svg>Can manage</span>
    <button class="wk-button" type="button">Invite a machine</button>
  </div>
  <div class="wk-toolbar" role="toolbar" aria-label="macbookpro">
    <button class="wk-button wk-button--quiet wk-button--icon" type="button" aria-label="Back">‹</button>
    <button class="wk-button wk-button--quiet wk-button--icon" type="button" aria-label="Forward" disabled>›</button>
    <h1 class="wk-toolbar-title">macbookpro</h1>
    <span class="wk-toolbar-spacer"></span>
    <span class="wk-dot-label"><span class="wk-dot" data-size="sm" data-shape="hollow" aria-hidden="true"></span><span>Reconnecting</span></span>
    <button class="wk-button" type="button">Open status window</button>
  </div>
</div>
</body>
</html>
