<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Stat</title>
<style>
  html { background: var(--wk-color-bg); }
  .spec { display: flex; flex-direction: column; gap: var(--wk-space-4); padding: var(--wk-space-4); }
  .spec .wk-stats-grid { max-width: 460px; }
</style>
</head>
<body class="wk-root">
<div class="spec">
  <div class="wk-stats-row" role="list">
    <div class="wk-stat" role="listitem"><span class="wk-stat-figure">3<small> / 4</small></span><span class="wk-stat-label">slots busy</span></div>
    <div class="wk-stat" role="listitem"><span class="wk-stat-figure">1</span><span class="wk-stat-label">job waiting</span></div>
    <div class="wk-stat" role="listitem"><span class="wk-stat-figure">34<small> s</small></span><span class="wk-stat-label">longest wait now</span></div>
    <div class="wk-stat" role="listitem"><span class="wk-stat-figure">23</span><span class="wk-stat-label">jobs since HQ started at 8:02 am</span></div>
  </div>
  <div class="wk-stats-grid">
    <div class="wk-stat wk-stat--tile"><span class="wk-stat-glyph" aria-hidden="true"><svg viewBox="0 0 18 18"><g fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="9" r="6.5"/><path d="M6 9.2l2.1 2.1L12.2 7"/></g></svg></span><b class="wk-stat-figure">1,438 jobs</b><span class="wk-stat-label">served for hq.schumacher.home</span></div>
    <div class="wk-stat wk-stat--tile"><span class="wk-stat-glyph" aria-hidden="true"><svg viewBox="0 0 18 18"><g fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="9" r="6.5"/><path d="M9 5.2V9l2.6 1.6"/></g></svg></span><b class="wk-stat-figure">125 h</b><span class="wk-stat-label">of machine time given</span></div>
    <div class="wk-stat wk-stat--tile"><span class="wk-stat-glyph" aria-hidden="true"><svg viewBox="0 0 18 18"><g fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="5" height="5" rx="1" fill="currentColor"/><rect x="10" y="3" width="5" height="5" rx="1"/><rect x="3" y="10" width="5" height="5" rx="1"/><rect x="10" y="10" width="5" height="5" rx="1"/></g></svg></span><b class="wk-stat-figure">1 of 2</b><span class="wk-stat-label">slots in use</span></div>
    <div class="wk-stat wk-stat--tile"><span class="wk-stat-glyph" aria-hidden="true"><svg viewBox="0 0 18 18"><g fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M9 2.5 14.5 4.5V9c0 3.2-2.3 5.4-5.5 6.5C5.8 14.4 3.5 12.2 3.5 9V4.5z"/><path d="M6.6 9l1.8 1.8 3.2-3.4"/></g></svg></span><b class="wk-stat-figure">OK</b><span class="wk-stat-label">last 12 starts worked</span></div>
  </div>
  <div class="wk-stats-grid">
    <div class="wk-stat"><b class="wk-stat-figure">1 of 2</b><span class="wk-stat-label">slots in use</span></div>
    <div class="wk-stat"><b class="wk-stat-figure">12</b><span class="wk-stat-label">starts in a row worked</span></div>
  </div>
</div>
</body>
</html>
