<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>SettingsTabs</title>
<style>
  html { background: var(--wk-color-bg); }
  .spec { padding: var(--wk-space-4); }
</style>
</head>
<body class="wk-root">
<div class="spec">
  <div class="wk-settings-tabs" role="tablist" aria-label="Settings">
    <button class="wk-settings-tab" role="tab" type="button" aria-selected="false"><svg viewBox="0 0 22 22" aria-hidden="true"><g fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><circle cx="11" cy="11" r="3"/><path d="M11 2.5v2.5M11 17v2.5M2.5 11H5M17 11h2.5M5 5l1.8 1.8M15.2 15.2 17 17M5 17l1.8-1.8M15.2 6.8 17 5"/></g></svg>General</button>
    <button class="wk-settings-tab" role="tab" type="button" aria-selected="true"><svg viewBox="0 0 22 22" aria-hidden="true"><g fill="none" stroke="currentColor" stroke-width="1.5"><rect x="4" y="4.5" width="14" height="10" rx="1.3"/><path d="M2 17.5h18"/><path d="M8 9.5l2 2 4-4" stroke-linecap="round"/></g></svg>Lending</button>
    <button class="wk-settings-tab" role="tab" type="button" aria-selected="false" data-attention aria-describedby="hq-review"><svg viewBox="0 0 22 22" aria-hidden="true"><g fill="none" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"><path d="M3 9.5 11 4l8 5.5V18H3z"/><path d="M8.5 18v-5h5v5"/></g></svg>HQ</button>
    <button class="wk-settings-tab" role="tab" type="button" aria-selected="false"><svg viewBox="0 0 22 22" aria-hidden="true"><g fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><circle cx="11" cy="11" r="8.5"/><path d="M11 10v5.5"/><path d="M11 6.8v.2"/></g></svg>About</button>
  </div>
  <span id="hq-review" hidden>Has a setting to review</span>
</div>
</body>
</html>
