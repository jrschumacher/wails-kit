<!doctype html>
<html lang="en" class="wk-root">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; object-src 'none'; base-uri 'none'; form-action 'none'">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" href="data:,">
  <title>Component gallery</title>
  <link rel="stylesheet" href="gallery.css">
  <script type="module" src="gallery.js"></script>
</head>
<!-- The component gallery for @wails-kit/ui, @wails-kit/editor and
     @wails-kit/diagram: every component in each state it can show, one page
     per component (#/button, #/range, …). Not shipped. Serve it with
     `npm run gallery` in frontend/gallery and open the URL it prints.
     gallery.js links the kit's stylesheet (src/ or dist/), the theme and
     the kit's module from the query (?source=dist&theme=example). -->
<body>
  <a class="wk-link gallery-skip" href="#gallery-main">Skip to the component</a>
  <div class="wk-three-pane gallery-app">
    <nav class="wk-sidebar gallery-nav" id="gallery-nav" aria-label="Components"></nav>
    <div class="wk-pane-list">
      <header class="wk-toolbar gallery-toolbar" id="gallery-toolbar"></header>
      <div class="gallery-forced" id="gallery-forced"></div>
      <main class="wk-pane-scroll gallery-main" id="gallery-main" tabindex="-1" aria-labelledby="gallery-title"></main>
    </div>
  </div>
</body>
</html>
