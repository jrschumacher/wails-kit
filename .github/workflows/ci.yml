name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read
  pull-requests: write

jobs:
  conventional-commits:
    name: Conventional Commits
    if: github.event_name == 'pull_request' && !startsWith(github.head_ref, 'release-please--')
    runs-on: self-hosted
    steps:
      - uses: amannn/action-semantic-pull-request@v5
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          types: |
            feat
            fix
            docs
            style
            refactor
            perf
            test
            build
            ci
            chore
            revert
          scopes: |
            appdirs
            ci
            database
            desktop
            diagnostics
            diagram
            editor
            frontend
            keyring
            lifecycle
            llm
            settings
            state
            errors
            events
            logging
            taskfiles
            shortcuts
            tasks
            ui
            updates
          requireScope: false
          subjectPattern: ^.+$
          subjectPatternError: "The subject must not be empty."

  test:
    name: Test
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4
      - uses: jrschumacher/go-actions/ci@v3
        with:
          job: test
          cache: false # Go caches are shared locally on the self-hosted runners.

  lint:
    name: Lint
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4
      - uses: jrschumacher/go-actions/ci@v3
        with:
          job: lint
          cache: false # Go caches are shared locally on the self-hosted runners.

  typecheck:
    name: TypeScript
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: npm ci
        working-directory: frontend/types
      - run: npm ci
        working-directory: frontend/settings
      - run: npm install --save-dev typescript
        working-directory: frontend
      - run: npx tsc --noEmit
        working-directory: frontend

  security:
    name: Security
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4
      - uses: jrschumacher/go-actions/ci@v3
        with:
          job: security
          cache: false # Go caches are shared locally on the self-hosted runners.

  ts-typecheck:
    name: TypeScript Typecheck
    runs-on: self-hosted
    defaults:
      run:
        working-directory: frontend/types
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm ci
      - run: npm run typecheck

  ts-lint:
    name: TypeScript Lint
    runs-on: self-hosted
    defaults:
      run:
        working-directory: frontend/types
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm ci
      - run: npm run lint

  settings-ts-typecheck:
    name: Settings TypeScript Typecheck
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm ci
        working-directory: frontend/types
      - run: npm ci
        working-directory: frontend/settings
      - run: npm run typecheck
        working-directory: frontend/settings

  settings-ts-lint:
    name: Settings TypeScript Lint
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm ci
        working-directory: frontend/types
      - run: npm ci
        working-directory: frontend/settings
      - run: npm run lint
        working-directory: frontend/settings

  settings-ts-test:
    name: Settings TypeScript Test
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm ci
        working-directory: frontend/types
      - run: npm ci
        working-directory: frontend/settings
      - run: npm run test
        working-directory: frontend/settings

  ui-test:
    name: UI Test
    runs-on: self-hosted
    defaults:
      run:
        working-directory: frontend/ui
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm ci
      # Static checks, including that the committed dist/ matches src/.
      - run: npm test
      # The custom elements and the settings window, in the runner's Chrome.
      - run: npm run test:browser
        env:
          CHROME_PATH: /usr/bin/google-chrome

  editor-test:
    name: Editor Test
    runs-on: self-hosted
    defaults:
      run:
        working-directory: frontend/editor
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm ci
      # Static checks, the licences, and that the committed dist/ matches a fresh build.
      - run: npm test
      # The code editor on the demo pages (they link frontend/ui's stylesheet), in the runner's Chrome.
      - run: npm run test:browser
        env:
          CHROME_PATH: /usr/bin/google-chrome

  diagram-test:
    name: Diagram Test
    runs-on: self-hosted
    defaults:
      run:
        working-directory: frontend/diagram
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm ci
      # Static checks, the licences, theme contrast, and that the committed dist/ matches a fresh build.
      - run: npm test
      # Every diagram type on the demo pages (they link frontend/ui's stylesheet) under a strict CSP, in the runner's Chrome.
      - run: npm run test:browser
        env:
          CHROME_PATH: /usr/bin/google-chrome

  gallery-test:
    name: Gallery Test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend/gallery
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/gallery/package-lock.json
      - run: npm ci
      # The server's paths, the CSP and the page list.
      - run: npm test
      # Every gallery page in light, dark, a theme and forced colours, in the runner's Chrome.
      - run: npm run test:browser
        env:
          CHROME_PATH: /usr/bin/google-chrome
