name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read
  pull-requests: write

jobs:
  conventional-commits:
    name: Conventional Commits
    if: github.event_name == 'pull_request' && !startsWith(github.head_ref, 'release-please--')
    runs-on: ubuntu-latest
    steps:
      - uses: amannn/action-semantic-pull-request@v5
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          types: |
            feat
            fix
            docs
            style
            refactor
            perf
            test
            build
            ci
            chore
            revert
          scopes: |
            appdirs
            appearance
            ci
            database
            diagnostics
            errors
            events
            firstrun
            frontend
            health
            i18n
            keyring
            kit
            lifecycle
            llm
            llmconfig
            logging
            permissions
            runner
            semver
            settings
            shortcuts
            state
            taskfiles
            template
            updates
            windowstate
          requireScope: false
          subjectPattern: ^.+$
          subjectPatternError: "The subject must not be empty."

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Required since WP-06 removed the `wails` build tag from shortcuts/apply.go:
      # wails/v3/pkg/application is now in the default build graph, and its Linux
      # implementation is cgo.
      #
      # beta.4's DEFAULT Linux backend is GTK4 (linux_cgo.go, `#cgo linux
      # pkg-config: gtk4 webkitgtk-6.0`). The GTK3 backend still exists but sits
      # behind a `gtk3` build tag (linux_cgo_gtk3.go, `//go:build ... && gtk3`).
      # Installing the GTK3 packages therefore satisfies a variant nothing builds
      # by default — which is exactly how this job failed on its first real run.
      - name: Install Wails Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential pkg-config libgtk-4-dev libwebkitgtk-6.0-dev
      # updates/signing_docs_test.go executes the signing recipe the README
      # documents, and skips when minisign is absent. Without it installed
      # here, the one test that proves the documented recipe actually works
      # silently never runs — which is how the previous recipe shipped
      # unusable for months.
      - name: Install minisign
        run: sudo apt-get install -y --no-install-recommends minisign
      - uses: jrschumacher/go-actions/ci@v3
        with:
          job: test

  # Uses golangci-lint-action directly rather than the go-actions wrapper.
  # The wrapper resolves golangci-lint "latest" at run time and verifies a
  # checksum against it; on this repo's first CI run that fetch produced a
  # checksum mismatch and failed the job outright. An unpinned third-party
  # download is not something a lint job should be able to break on, so the
  # version is pinned here to match what developers run locally.
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Wails Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential pkg-config libgtk-4-dev libwebkitgtk-6.0-dev
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - uses: golangci/golangci-lint-action@v7
        with:
          version: v2.10.1

  wails-imports:
    name: Wails Import Policy (AD-4)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - run: ./.github/scripts/check-wails-imports.sh

  # go.work unions the nested anyllm module's dependency graph into local
  # builds, which can mask a dependency the root go.mod fails to declare. That
  # is invisible here and a hard build failure for consumers — it happened once
  # with golang.org/x/text, where i18n compiled locally and would not have
  # compiled for anyone else. Building with the workspace disabled is what a
  # consumer actually experiences.
  consumer-build:
    name: Consumer Build (no workspace)
    runs-on: ubuntu-latest
    env:
      GOWORK: "off"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Install Wails Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential pkg-config libgtk-4-dev libwebkitgtk-6.0-dev
      - run: go build ./...
      - run: go mod tidy -diff

  # The nested module is a separate module: `go build ./...` at the root does
  # not reach it, so without this it can fail to compile while the root build
  # reports clean. That also happened once during development.
  nested-module:
    name: Nested Module (anyllm)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: settings/templates/anyllm
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: settings/templates/anyllm/go.mod
          cache: true
      - run: go build ./...
      - run: go test -race ./...

  typecheck:
    name: TypeScript
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: npm ci
        working-directory: frontend/types
      - run: npm ci
        working-directory: frontend/settings
      - run: npm install --save-dev typescript
        working-directory: frontend
      - run: npx tsc --noEmit
        working-directory: frontend

  security:
    name: Security
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Wails Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential pkg-config libgtk-4-dev libwebkitgtk-6.0-dev
      - uses: jrschumacher/go-actions/ci@v3
        with:
          job: security

  ts-typecheck:
    name: TypeScript Typecheck
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend/types
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/types/package-lock.json
      - run: npm ci
      - run: npm run typecheck

  ts-lint:
    name: TypeScript Lint
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend/types
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/types/package-lock.json
      - run: npm ci
      - run: npm run lint

  settings-ts-typecheck:
    name: Settings TypeScript Typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/settings/package-lock.json
      - run: npm ci
        working-directory: frontend/types
      - run: npm ci
        working-directory: frontend/settings
      - run: npm run typecheck
        working-directory: frontend/settings

  settings-ts-lint:
    name: Settings TypeScript Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/settings/package-lock.json
      - run: npm ci
        working-directory: frontend/types
      - run: npm ci
        working-directory: frontend/settings
      - run: npm run lint
        working-directory: frontend/settings

  settings-ts-test:
    name: Settings TypeScript Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/settings/package-lock.json
      - run: npm ci
        working-directory: frontend/types
      - run: npm ci
        working-directory: frontend/settings
      - run: npm run test
        working-directory: frontend/settings

  # WP-32: generates a real app from template/app via the wails3 CLI, points
  # it at this checkout (kit not yet tagged — see template/app/go.mod.tmpl and
  # README.md), and builds both the Go binary and the Vite frontend. A
  # template that doesn't build is worse than no template, and templates rot
  # silently unless something actually generates from them on every change.
  template-smoke:
    name: Template Smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Wails Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential pkg-config libgtk-4-dev libwebkitgtk-6.0-dev
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      # Pinned to the exact wails/v3 version this repo targets (AD-2) — the
      # CLI's project-scaffolding logic (internal/templates, internal/gosod)
      # is independent of that pin, but the generated go.mod requires this
      # exact SDK version, so generating with a mismatched CLI would be
      # testing a combination no consumer actually has.
      - name: Install wails3 CLI
        run: go install github.com/wailsapp/wails/v3/cmd/wails3@v3.0.0-beta.4

      - name: Generate app from template
        run: |
          wails3 init -t ./template/app -n kit-smoke-app -d "$RUNNER_TEMP" \
            -mod github.com/wails-kit/kit-smoke-app -skipgomodtidy -s -q
        # -skipgomodtidy is required: wails-kit v2 has no tagged release yet
        # (OQ-1), so the automatic `go mod tidy` init() would otherwise run
        # fails trying to fetch an unpublished module — verified locally,
        # see template/AGENTS.md, "Landmines".

      - name: Point generated app at this checkout (Go)
        working-directory: ${{ runner.temp }}/kit-smoke-app
        run: |
          go mod edit -replace github.com/jrschumacher/wails-kit/v2="$GITHUB_WORKSPACE"
          go mod tidy

      # The kit's TS packages are unpublished, so the generated app consumes
      # them by file: ref. Those refs symlink into this checkout, and Node and
      # TypeScript resolve from the real path — so @wails-kit/settings looks
      # for its own @wails-kit/types dependency inside the checkout, not in
      # the generated app's node_modules. Installing the frontend workspace
      # first materialises frontend/node_modules/@wails-kit/types, which the
      # linked package then resolves by walking up. Without this the smoke
      # fails with TS2307 on a package that is right there on disk.
      - name: Materialise kit frontend workspace links
        working-directory: ${{ github.workspace }}/frontend
        run: |
          npm ci
          # The packages point "types" at source (so a consumer typechecks
          # without a build step) but "main"/"module" at dist/. A bundler
          # resolves the runtime entry, not the types entry, so without
          # building here vite fails with "Failed to resolve entry for
          # package" even though tsc is perfectly happy — exactly how this
          # job failed once the link fix landed.
          npm run build --workspaces

      - name: Point generated app at this checkout (npm) and build frontend
        working-directory: ${{ runner.temp }}/kit-smoke-app/frontend
        run: |
          npm pkg set dependencies.@wails-kit/types="file:$GITHUB_WORKSPACE/frontend/types"
          npm pkg set dependencies.@wails-kit/settings="file:$GITHUB_WORKSPACE/frontend/settings"
          npm pkg set dependencies.@wails-kit/i18n="file:$GITHUB_WORKSPACE/frontend/i18n"
          # No lockfile exists yet — this is a freshly generated project, not
          # a cloned one — so `npm ci` (which requires one) does not apply.
          npm install
          npm run typecheck
          npm run build

      - name: Build the Go binary
        working-directory: ${{ runner.temp }}/kit-smoke-app
        run: |
          # Not `go build ./...`: wails3's own auto-generated build/ios
          # scaffold (build/config.yml-driven, unrelated to this template)
          # does not compile standalone on a non-ios host — verified locally.
          # The app itself is the root package.
          go build .
          go vet ./...
